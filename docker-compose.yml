services:

  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  spotify-proxy:
    build:
      context: ./spotify-proxy
      dockerfile: Dockerfile
    container_name: spotify-proxy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      REDIS_ADDR: redis:6379
      FRONTEND_ORIGIN: http://localhost:5173
      CREDENTIAL_KEY: "0123456789abcdef0123456789abcdef"
      OAUTH_CALLBACK_URL: http://localhost:8081/api/v1/spotify/auth/callback
      SPOTIFY_DEVICE_NAME: play-something
    depends_on:
      redis:
        condition: service_started

volumes:
  redis_data:
