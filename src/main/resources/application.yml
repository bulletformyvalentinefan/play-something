server:
  port: 8080

spring:
  application:
    name: spotify-backend

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: spotify_user
    password: spotify_pwd
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: spotify-group
      auto-offset-reset: earliest