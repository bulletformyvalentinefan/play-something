version: '3.8'

services:

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: spotify-oracle
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle_root_pwd
      - APP_USER=spotify_user
      - APP_USER_PASSWORD=spotify_pwd
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: spotify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  spotify-proxy:
    build:
      context: ./spotify-proxy
      dockerfile: Dockerfile
    container_name: spotify-proxy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      ORACLE_DSN: oracle://spotify_user:spotify_pwd@oracle-db:1521/FREEPDB1
      REDIS_ADDR: redis:6379
      FRONTEND_ORIGIN: http://localhost:5173
      CREDENTIAL_KEY: "0123456789abcdef0123456789abcdef"
      OAUTH_CALLBACK_URL: http://localhost:8081/api/v1/spotify/auth/callback
      SPOTIFY_DEVICE_NAME: play-something
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  oracle_data:
  redis_data: