name: CI

on:
  push:
    branches: [ "main", "features", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install audio deps (CGO)
        run: sudo apt-get update && sudo apt-get install -y libogg-dev libvorbis-dev libflac-dev libmpg123-dev pkg-config
      - working-directory: spotify-proxy
        run: |
          go vet ./...
          go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
