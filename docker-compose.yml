services:

  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  spotify-proxy:
    build:
      context: ./spotify-proxy
      dockerfile: Dockerfile
    container_name: spotify-proxy
    ports:
      - "8081:8081"
      - "8989:8989"
    environment:
      PORT: 8081
      REDIS_ADDR: redis:6379
      FRONTEND_ORIGIN: http://localhost:3000
      # Sonora: 127.0.0.1:8989/login whitelisted para client_id 65b... oficial, no localhost
      OAUTH_CALLBACK_URL: http://127.0.0.1:8989/login
      SPOTIFY_CLIENT_ID: "65b708073fc0480ea92a077233ca87bd"
      SPOTIFY_DEVICE_NAME: play-something
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spotify-frontend
    ports:
      - "3000:80"
    depends_on:
      - spotify-proxy

volumes:
  redis_data:
